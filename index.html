import sys
import asyncio
import platform
import json
from pathlib import Path


async def custom_site():

    import embed

    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = True
    platform.window.canvas.style.visibility = "visible"

    bundle = "alcanzar"

    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir()

    if platform.window.location.host.find('.itch.zone') > 0:

        import zipfile

        async with platform.fopen(
            "alcanzar.apk",
            "rb"
        ) as archive:

            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())

    else:

        import tarfile

        async with platform.fopen(
            "alcanzar.tar.gz",
            "rb"
        ) as archive:

            tar = tarfile.open(
                fileobj=archive,
                mode="r:gz"
            )

            tar.extractall(
                path=appdir.as_posix(),
                filter="tar"
            )

            tar.close()

    platform.run_main(
        PyConfig,
        loaderhome=appdir / "assets",
        loadermain=None
    )

    while embed.counter() < 0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:

        __import__(__name__).__file__ = main

        msg = "Ready to start ! Please click/touch page"

        platform.window.infobox.innerText = msg

        print(
            "\n" * 4,
            f"    * Waiting for media user engagement. {msg} *",
            "\n" * 4
        )

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    await TopLevel_async_handler.start_toplevel(
        platform.shell,
        console=window.python.config.debug
    )

    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(
        main,
        callback=ui_callback
    )

    platform.window.infobox.style.display = "none"

    platform.window.config.gui_divider = 1

    platform.window.window_resize()

    print("default.tmpl: done")

    shell.interactive()


asyncio.run(custom_site())

<script type="application/javascript">


/*
============================================================
CENTRAR Y ESCALAR EL JUEGO
============================================================
*/

const gameCanvas =
    document.getElementById("canvas");


function ajustarPantalla() {

    if (!gameCanvas) {
        return;
    }


    /*
    Tamaño real de la ventana.
    */

    const pantallaAncho =
        window.innerWidth;

    const pantallaAlto =
        window.innerHeight;


    /*
    El juego es 800x600.
    Proporción 4:3.
    */

    const proporcion =
        800 / 600;


    let ancho;
    let alto;


    /*
    Si la pantalla es muy ancha,
    limitamos por la altura.
    */

    if (
        pantallaAncho / pantallaAlto >
        proporcion
    ) {

        alto =
            pantallaAlto;

        ancho =
            alto * proporcion;

    }


    /*
    Si la pantalla es más estrecha,
    limitamos por el ancho.
    */

    else {

        ancho =
            pantallaAncho;

        alto =
            ancho / proporcion;

    }


    /*
    Evitamos números decimales.
    */

    ancho =
        Math.floor(ancho);

    alto =
        Math.floor(alto);


    /*
    Calculamos exactamente
    dónde empieza el canvas.
    */

    const izquierda =
        Math.floor(
            (pantallaAncho - ancho) / 2
        );


    const arriba =
        Math.floor(
            (pantallaAlto - alto) / 2
        );


    /*
    Aplicamos tamaño.
    */

    gameCanvas.style.width =
        ancho + "px";

    gameCanvas.style.height =
        alto + "px";


    /*
    Aplicamos posición.
    */

    gameCanvas.style.position =
        "fixed";


    gameCanvas.style.left =
        izquierda + "px";


    gameCanvas.style.top =
        arriba + "px";


    gameCanvas.style.right =
        "auto";


    gameCanvas.style.bottom =
        "auto";


    /*
    MUY IMPORTANTE:
    */

    gameCanvas.style.transform =
        "none";


    gameCanvas.style.margin =
        "0";


    gameCanvas.style.padding =
        "0";
}


/*
============================================================
AJUSTE INICIAL
============================================================
*/

ajustarPantalla();


/*
============================================================
AL CAMBIAR EL TAMAÑO
============================================================
*/

window.addEventListener(
    "resize",
    function () {

        ajustarPantalla();

        /*
        Pygbag puede modificar el canvas
        después del resize.
        */

        setTimeout(
            ajustarPantalla,
            50
        );

        setTimeout(
            ajustarPantalla,
            200
        );

    }
);


/*
============================================================
AL GIRAR EL MÓVIL
============================================================
*/

window.addEventListener(
    "orientationchange",
    function () {

        setTimeout(
            ajustarPantalla,
            100
        );

        setTimeout(
            ajustarPantalla,
            300
        );

        setTimeout(
            ajustarPantalla,
            600
        );

    }
);


/*
============================================================
AL TERMINAR DE CARGAR
============================================================
*/

window.addEventListener(
    "load",
    function () {

        ajustarPantalla();

        setTimeout(
            ajustarPantalla,
            100
        );

        setTimeout(
            ajustarPantalla,
            500
        );

    }
);


/*
============================================================
VIGILAR CAMBIOS DEL CANVAS
============================================================
*/

if (window.ResizeObserver) {

    const observador =
        new ResizeObserver(
            function () {

                setTimeout(
                    ajustarPantalla,
                    0
                );

            }
        );

    observador.observe(gameCanvas);
}


/*
============================================================
TECLADO VIRTUAL
============================================================
*/

const mobileInput =
    document.getElementById(
        "mobile-text-input"
    );


if (
    mobileInput &&
    gameCanvas
) {


    gameCanvas.addEventListener(
        "touchstart",
        function () {

            mobileInput.focus({
                preventScroll: true
            });

        },
        {
            passive: true
        }
    );


    gameCanvas.addEventListener(
        "click",
        function () {

            mobileInput.focus({
                preventScroll: true
            });

        }
    );


    mobileInput.addEventListener(
        "blur",
        function () {

            gameCanvas.focus();

        }
    );

}


/*
============================================================
PYGBAG
============================================================
*/

globalThis.__canvas_resized =

function info_inline(data) {

    document
        .getElementById("info")
        .innerHTML = data;

}


function info_online(url) {

    fetch(url)

        .then(
            (response) =>
                response.text()
        )

        .then(
            (html) =>
                info_inline(html)
        )

        .catch(
            (error) =>
                console.warn(error)
        );

}


function frame_online(url) {

    window.frames["iframe"].location =
        url;

}
