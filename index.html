import sys
import asyncio
import platform
import json
from pathlib import Path


async def custom_site():

    import embed

    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = True
    platform.window.canvas.style.visibility = "visible"

    bundle = "alcanzar"

    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir()

    if platform.window.location.host.find('.itch.zone') > 0:

        import zipfile

        async with platform.fopen(
            "alcanzar.apk",
            "rb"
        ) as archive:

            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())

    else:

        import tarfile

        async with platform.fopen(
            "alcanzar.tar.gz",
            "rb"
        ) as archive:

            tar = tarfile.open(
                fileobj=archive,
                mode="r:gz"
            )

            tar.extractall(
                path=appdir.as_posix(),
                filter="tar"
            )

            tar.close()

    platform.run_main(
        PyConfig,
        loaderhome=appdir / "assets",
        loadermain=None
    )

    while embed.counter() < 0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:

        __import__(__name__).__file__ = main

        msg = "Ready to start ! Please click/touch page"

        platform.window.infobox.innerText = msg

        print(
            "\n" * 4,
            f"    * Waiting for media user engagement. {msg} *",
            "\n" * 4
        )

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    await TopLevel_async_handler.start_toplevel(
        platform.shell,
        console=window.python.config.debug
    )

    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(
        main,
        callback=ui_callback
    )

    platform.window.infobox.style.display = "none"

    platform.window.config.gui_divider = 1

    platform.window.window_resize()

    print("default.tmpl: done")

    shell.interactive()


asyncio.run(custom_site())

<script type="application/javascript">


/*
============================================================
CORRECCIÓN FLECHA ARRIBA EN TABLET
============================================================
*/

const gameCanvas =
    document.getElementById(
        "canvas"
    );


if (gameCanvas) {

    gameCanvas.addEventListener(
        "pointerdown",
        function (event) {

            const rect =
                gameCanvas.getBoundingClientRect();

            const escalaX =
                gameCanvas.width / rect.width;

            const escalaY =
                gameCanvas.height / rect.height;

            const x =
                (event.clientX - rect.left) * escalaX;

            const y =
                (event.clientY - rect.top) * escalaY;


            /*
            Posición de ARRIBA en el juego:

                centro_x = 110

                centro_y = alto - 120
                         = 480

                separacion = 55

                arriba = 425
            */

            const arribaX = 110;
            const arribaY = 400;


            const distanciaX =
                x - arribaX;

            const distanciaY =
                y - arribaY;


            /*
            Zona táctil ampliada SOLO para ARRIBA.
            */

            if (
                Math.abs(distanciaX) <= 50 &&
                Math.abs(distanciaY) <= 50
            ) {

                event.preventDefault();


                gameCanvas.dispatchEvent(
                    new KeyboardEvent(
                        "keydown",
                        {
                            key: "ArrowUp",
                            code: "ArrowUp",
                            keyCode: 38,
                            which: 38,
                            bubbles: true
                        }
                    )
                );

            }

        },
        {
            passive: false
        }
    );

}

    fetch(url)

        .then(
            (html) =>

        )

        .catch(

}
